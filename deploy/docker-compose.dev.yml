services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scraper
      POSTGRES_PASSWORD: scraper
      POSTGRES_DB: scraper
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scraper"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  browser:
    image: ${BROWSER_IMAGE:-ghcr.io/browserless/chromium@sha256:9e48bf8df71ba285f974dd9bd9effb59ce8a1e767cfe734b36a24b065ab033f4}
    environment:
      CONCURRENT: 4
      TIMEOUT: 45000
      TOKEN: dev-token-do-not-use-in-production
    ports:
      - "127.0.0.1:3000:3000"
    shm_size: 1gb
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped

volumes:
  pgdata: {}
  redisdata: {}
