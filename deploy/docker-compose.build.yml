services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-local}
