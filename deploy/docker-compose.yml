x-app-environment: &app-environment
  - APP_URL=${APP_URL:?required}
  - DATABASE_URL=${DATABASE_URL:?required}
  - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
  - ENCRYPTION_KEY=${ENCRYPTION_KEY:?required}
  - SESSION_SECRET=${SESSION_SECRET:?required}
  - MAIL_FROM=${MAIL_FROM:?required}
  - BROWSER_WS_ENDPOINT=ws://browser:3000?token=${BROWSER_TOKEN:?required}
  - APP_VERSION
  - GIT_SHA
  - APP_ENV
  - LOG_LEVEL
  - LOG_FORMAT
  - DEFAULT_LOCALE
  - SUPPORTED_LOCALES
  - CORS_ORIGINS
  - TRUST_PROXY
  - ENABLE_OPENAPI
  - ENABLE_BULL_BOARD
  - ENABLE_REGISTRATION
  - DATABASE_POOL_MAX
  - DATABASE_SSL
  - RUN_MIGRATIONS_ON_BOOT
  - WORKER_CONCURRENCY
  - NOTIFY_CONCURRENCY
  - SESSION_TTL_SECONDS
  - RATE_LIMIT_ENABLED
  - MIN_SCRAPE_INTERVAL_SECONDS
  - MAX_MONITORS_PER_USER
  - SCRAPE_TIMEOUT_MS
  - SCRAPE_USER_AGENT
  - RESPECT_ROBOTS_TXT
  - DOMAIN_RATE_LIMIT_PER_MINUTE
  - AUTO_PAUSE_AFTER_FAILURES
  - BLOCKED_HOST_PATTERNS
  - BROWSER_TIMEOUT_MS
  - BROWSER_MAX_CONTEXTS
  - SCREENSHOTS_ENABLED
  - STORAGE_DRIVER
  - STORAGE_LOCAL_PATH
  - RUN_RETENTION_DAYS
  - SNAPSHOT_RETENTION_DAYS
  - MAIL_DRIVER
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_USER
  - SMTP_PASSWORD
  - SMTP_SECURE
  - RESEND_API_KEY
  - OTEL_EXPORTER_OTLP_ENDPOINT
  - OTEL_SERVICE_NAME
  - METRICS_ENABLED
  - SENTRY_DSN

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scraper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-scraper}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scraper}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

  browser:
    image: ${BROWSER_IMAGE:-ghcr.io/browserless/chromium@sha256:9e48bf8df71ba285f974dd9bd9effb59ce8a1e767cfe734b36a24b065ab033f4}
    environment:
      CONCURRENT: ${BROWSER_MAX_CONTEXTS:-4}
      TIMEOUT: ${BROWSER_TIMEOUT_MS:-45000}
      TOKEN: ${BROWSER_TOKEN:?required}
    shm_size: 1gb
    deploy:
      resources:
        limits:
          memory: 2g
    restart: unless-stopped
    stop_grace_period: 30s

  api:
    image: ghcr.io/${GH_ORG}/scraper-api:${IMAGE_TAG:?required}
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "run", "healthcheck.ts"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 60s

  worker:
    image: ghcr.io/${GH_ORG}/scraper-worker:${IMAGE_TAG:?required}
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - snapshots:/data/snapshots
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    restart: unless-stopped
    stop_grace_period: 60s

  web:
    image: ghcr.io/${GH_ORG}/scraper-web:${IMAGE_TAG:?required}
    environment:
      APP_VERSION: ${APP_VERSION:-}
      GIT_SHA: ${GIT_SHA:-}
      API_URL: ${API_URL:-http://api:3001}
      APP_TITLE: ${APP_TITLE:-Scraper}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  pgdata: {}
  redisdata: {}
  snapshots: {}
